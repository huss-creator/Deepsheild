{% extends "base.html" %}

{% block title %}500 — Server Error{% endblock %}

{% block content %}
<div class="container py-5 my-5 text-center">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8">
            <div class="card p-5 border-0 shadow-lg" style="background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(12px); border-radius: 16px;">
                <div class="mb-4">
                    <span class="badge bg-danger px-3 py-2 text-uppercase font-monospace" style="letter-spacing: 0.1em;">Error 500</span>
                </div>
                <h1 class="display-5 fw-bold text-light mb-3">We couldn’t complete this request</h1>
                <p class="text-secondary mb-4 lead fs-6">
                    Please try again. If the problem continues, contact the site administrator.
                </p>
                <div class="d-flex justify-content-center gap-3">
                    <a href="{% url 'home' %}" class="btn btn-outline-primary px-4 py-2">
                        <i class="bi bi-house me-2"></i>Return Home
                    </a>
                    {% if user.is_authenticated %}
                    <a href="{% url 'upload' %}" class="btn btn-primary px-4 py-2">
                        <i class="bi bi-speedometer2 me-2"></i>Dashboard
                    </a>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
